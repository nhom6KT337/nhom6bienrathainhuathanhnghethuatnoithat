iness, Can Tho University, as part of the E-Commerce course (KT337). Recognizing the increasingly serious plastic waste pollution problem, we turned challenges into opportunities — creating unique interior decorations from recycled plastic."},aboutStoryP2:{vi:"Mô hình kinh doanh của chúng tôi hoạt động theo hướng B2C (Business to Consumer), thu gom rác thải nhựa từ hộ gia đình, trường học và doanh nghiệp, sau đó phân loại, xử lý và tái chế thành các sản phẩm có giá trị sử dụng và giá trị thẩm mỹ cao.",en:"Our business model operates in a B2C (Business to Consumer) direction, collecting plastic waste from households, schools and businesses, then sorting, processing and recycling them into products with high practical and aesthetic value."},aboutStoryP3:{vi:"Chúng tôi tin rằng mỗi sản phẩm không chỉ là một vật trang trí, mà còn là một câu chuyện về sự tái sinh — nơi rác thải được hồi sinh thành nghệ thuật, góp phần thúc đẩy tiêu dùng xanh và phát triển bền vững.",en:"We believe that each product is not just a decoration, but a story of rebirth — where waste is revived into art, contributing to green consumption and sustainable development."},aboutMission:{vi:"Sứ mệnh",en:"Mission"},aboutMissionDesc:{vi:"Giảm thiểu rác thải nhựa ra môi trường thông qua việc tái chế sáng tạo, đồng thời nâng cao nhận thức cộng đồng về tiêu dùng bền vững.",en:"Reduce plastic waste in the environment through creative recycling, while raising community awareness about sustainable consumption."},aboutVision:{vi:"Tầm nhìn",en:"Vision"},aboutVisionDesc:{vi:"Trở thành thương hiệu hàng đầu trong lĩnh vực sản phẩm trang trí nội thất tái chế tại Việt Nam, mở rộng ra thị trường quốc tế.",en:"Become the leading brand in recycled interior decoration products in Vietnam, expanding to international markets."},aboutValues:{vi:"Giá trị cốt lõi",en:"Core Values"},aboutValuesDesc:{vi:"Sáng tạo — Bền vững — Chất lượng — Trách nhiệm xã hội. Mỗi sản phẩm đều mang theo cam kết bảo vệ môi trường.",en:"Creativit
